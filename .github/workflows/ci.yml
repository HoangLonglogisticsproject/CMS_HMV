# Checks every pull request into main and every push to main (post-merge). Builds and tests only: no deployment,
# no secrets. Databases are throwaway PostgreSQL service containers on the runner, never development or production.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a new push to a PR supersedes; main runs complete

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.18.0 # Node.js 24 LTS, same as development; pnpm comes from "packageManager" in package.json

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter backend lint
      - run: pnpm --filter frontend lint
      - name: Backend unit tests
        run: pnpm --filter backend test
      - name: Frontend unit tests (no servers)
        run: pnpm --filter frontend test:unit
      - run: pnpm --filter backend build
      - run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000 # public build-time URL, not a secret

  integration:
    name: integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hmv_ci
          POSTGRES_DB: hmv_shadow_test
          # Throwaway container reachable only from this job: no password exists, so none can be committed or logged.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hmv_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Database names must end in _test (enforced by the test setup). There is no backend/.env on the runner.
      TEST_DATABASE_URL: postgresql://hmv_ci@localhost:5432/hmv_cms_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations match schema.prisma
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: >-
          pnpm exec prisma migrate diff --exit-code
          --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://hmv_ci@localhost:5432/hmv_shadow_test
      - name: Integration tests (migrate deploy + API against PostgreSQL)
        run: pnpm --filter backend test:e2e

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hmv_ci
          POSTGRES_DB: hmv_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway container, see the integration job
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hmv_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://hmv_ci@localhost:5432/hmv_cms_e2e_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright Chromium (+ system dependencies)
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Browser E2E (API :4100 + CMS :3100, test accounts only)
        run: pnpm --filter frontend test:e2e
      # Traces hold only throwaway *@e2e.test sessions against the job's own database.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
